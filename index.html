<!DOCTYPE html>
<html lang="en" class="dark antialiased">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The White Meat</title>
  <meta name="description" content="Pick an artist. Listen through every album, EP, and non-album single. Keep the white meat." />
  <meta name="theme-color" content="#0b0b0a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Anton&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("the-white-meat-theme");
        if (t === "light") {
          document.documentElement.classList.remove("dark");
          document.documentElement.classList.add("light");
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", "#FFFFFF");
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="./app.js"></script>
</body>
</html>
